name: Build and push image

# On a version tag (e.g. v1.2.3), build the app image for amd64+arm64 and push it to GHCR
# tagged 1, 1.2, 1.2.3, latest, and the full commit SHA.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU + Buildx give us the arm64 build on an amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jontheniceguy/ci-pluggable-secrets-extension
          # v1.2.3 -> 1, 1.2, 1.2.3 (metadata-action withholds the sliding major/minor
          # tags for a prerelease so it can't clobber a stable release), plus the full SHA.
          tags: |
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=sha,format=long,prefix=
          # latest=auto adds :latest for a normal (non-prerelease) semver tag.
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
