{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cpse.fullname" . }}-secret
  labels:
    {{- include "cpse.labels" . | nindent 4 }}
type: Opaque
stringData:
  DRONE_ENV_PLUGIN_SECRET: {{ required "set pluginSecret or existingSecret" .Values.pluginSecret | quote }}
{{- end }}
{{- if .Values.signingKeys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cpse.fullname" . }}-keys
  labels:
    {{- include "cpse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $pem := .Values.signingKeys }}
  {{ $name }}: |
    {{- $pem | nindent 4 }}
  {{- end }}
{{- end }}
